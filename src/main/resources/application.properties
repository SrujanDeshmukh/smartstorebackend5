# ================================
# APPLICATION CONFIGURATION
# ================================
spring.application.name=Smart Store
app.name=SmartStore

# ================================
# MONGODB CONFIGURATION
# ================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://srujandeshmukh9:giridhar5@smartstore-cluster.kakfedt.mongodb.net/smartstore?retryWrites=true&w=majority&appName=SmartStore-cluster}

# MongoDB Connection Pool Optimization
spring.data.mongodb.connection-pool.max-size=50
spring.data.mongodb.connection-pool.min-size=5
spring.data.mongodb.connection-pool.max-wait-time=1000
spring.data.mongodb.connection-pool.max-connection-idle-time=60000
spring.data.mongodb.connection-pool.max-connection-life-time=120000

# Enable automatic index creation for unique constraints
spring.data.mongodb.auto-index-creation=true

# ================================
# EMAIL CONFIGURATION (OPTIMIZED)
# ================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:smartstorebackend@gmail.com}
spring.mail.password=${MAIL_PASSWORD:acehlsqfmbhnqxzk}
spring.mail.default-encoding=UTF-8

# SMTP Authentication & Security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# SMTP Performance Optimization (CRITICAL FOR SPEED)
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Additional SMTP Optimizations
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.debug=false

# ================================
# JWT CONFIGURATION
# ================================
jwt.secret=${JWT_SECRET:d84ev983ra9nhf84hfj984hf9hsf8943fh98shf}
jwt.access.expiration=900000
jwt.refresh.expiration=2592000000  
jwt.clock.skew=60000

# ================================
# USER AUTHENTICATION CONFIGURATION
# ================================
app.user.default.role=USER
app.max.login.attempts=5
app.account.lockout.minutes=30

# ================================
# OTP CONFIGURATION (CONSOLIDATED)
# ================================
app.otp.validity.minutes=5
app.otp.max.attempts=3
app.otp.resend.cooldown.seconds=60

# ================================
# ASYNC & THREAD POOL CONFIGURATION
# ================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=30s
spring.task.execution.pool.allow-core-thread-timeout=true
spring.task.execution.thread-name-prefix=SmartStore-Async-

# ================================
# SERVER CONFIGURATION
# ================================
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ================================
# LOGGING CONFIGURATION
# ================================
logging.level.com.raghunath.smartstore=INFO
logging.level.org.springframework.mail=INFO
logging.level.org.mongodb.driver=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ================================
# PERFORMANCE OPTIMIZATIONS
# ================================
spring.jpa.open-in-view=false
spring.devtools.livereload.enabled=false

# Jackson Configuration for JSON Processing
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ================================
# CACHE CONFIGURATION
# ================================
spring.cache.type=simple
spring.cache.cache-names=otpCache,vendorCache,userCache

# ================================
# MONITORING & HEALTH CHECK
# ================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ================================
# FILE UPLOAD CONFIGURATION
# ================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================================
# VALIDATION CONFIGURATION
# ================================
spring.validation.enabled=true

# ================================
# ENVIRONMENT SPECIFIC SETTINGS
# ================================
spring.profiles.active=dev
debug=false
trace=false
