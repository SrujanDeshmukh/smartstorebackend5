# ================================
# APPLICATION CONFIGURATION
# ================================
spring.application.name=Smart Store
app.name=SmartStore

# ================================
# MONGODB CONFIGURATION
# ================================
spring.data.mongodb.uri=${MONGODB_URI}

# MongoDB Connection Pool Optimization
spring.data.mongodb.connection-pool.max-size=50
spring.data.mongodb.connection-pool.min-size=5
spring.data.mongodb.connection-pool.max-wait-time=1000
spring.data.mongodb.connection-pool.max-connection-idle-time=60000
spring.data.mongodb.connection-pool.max-connection-life-time=120000

# Enable automatic index creation for unique constraints
spring.data.mongodb.auto-index-creation=true

# ================================
# MAILTRAP API CONFIGURATION
# ================================
mailtrap.api.token=${MAILTRAP_API_TOKEN}
mailtrap.from.email=${MAILTRAP_FROM_EMAIL}
mailtrap.from.name=${MAILTRAP_FROM_NAME}

# ================================
# JWT CONFIGURATION
# ================================
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:2592000000}
jwt.clock.skew=${JWT_CLOCK_SKEW:60000}

# ================================
# USER AUTHENTICATION CONFIGURATION
# ================================
app.user.default.role=USER
app.max.login.attempts=5
app.account.lockout.minutes=30

# ================================
# OTP CONFIGURATION (CONSOLIDATED)
# ================================
app.otp.validity.minutes=${OTP_VALIDITY_MINUTES:5}
app.otp.max.attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.resend.cooldown.seconds=${OTP_RESEND_COOLDOWN:60}

# ================================
# ASYNC & THREAD POOL CONFIGURATION
# ================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=30s
spring.task.execution.pool.allow-core-thread-timeout=true
spring.task.execution.thread-name-prefix=SmartStore-Async-

# ================================
# SERVER CONFIGURATION
# ================================
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ================================
# LOGGING CONFIGURATION
# ================================
logging.level.com.raghunath.smartstore=INFO
logging.level.org.springframework.mail=INFO
logging.level.org.mongodb.driver=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ================================
# PERFORMANCE OPTIMIZATIONS
# ================================
spring.jpa.open-in-view=false
spring.devtools.livereload.enabled=false

# Jackson Configuration for JSON Processing
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ================================
# CACHE CONFIGURATION
# ================================
spring.cache.type=simple
spring.cache.cache-names=otpCache,vendorCache,userCache

# ================================
# MONITORING & HEALTH CHECK
# ================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ================================
# FILE UPLOAD CONFIGURATION
# ================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================================
# VALIDATION CONFIGURATION
# ================================
spring.validation.enabled=true

# ================================
# ENVIRONMENT SPECIFIC SETTINGS
# ================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
debug=false
trace=false
